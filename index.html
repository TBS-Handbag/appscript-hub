<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QL App</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1C2B4A">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231C2B4A'/%3E%3Crect x='6' y='6' width='9' height='9' rx='1.5' fill='%23fff'/%3E%3Crect x='17' y='6' width='9' height='9' rx='1.5' fill='%23fff'/%3E%3Crect x='6' y='17' width='9' height='9' rx='1.5' fill='%23fff'/%3E%3Crect x='17' y='17' width='9' height='9' rx='1.5' fill='%23F5B700'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EEF0EC;
    --plate: #FFFFFF;
    --ink: #1C2B4A;
    --muted: #5B6577;
    --rule: #CDD2CA;
    --signal: #F5B700;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141A25; --plate: #1D2535; --ink: #E8EBF1; --muted: #9AA3B5; --rule: #2E384D; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 15px/1.5 "Be Vietnam Pro", system-ui, sans-serif;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }

  header { padding: 48px 0 32px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: end; justify-content: space-between; border-bottom: 2px solid var(--ink); }
  h1 { margin: 0; font-size: clamp(32px, 6vw, 52px); font-weight: 800; line-height: 1.05; letter-spacing: -0.02em; }
  .lead { margin: 10px 0 0; color: var(--muted); max-width: 52ch; }
  .edit { color: var(--ink); font-weight: 600; text-decoration: none; padding: 10px 16px; border: 1.5px solid var(--ink); border-radius: 6px; white-space: nowrap; }
  .edit:hover { background: var(--ink); color: var(--bg); }

  main { padding: 8px 0 64px; }
  .group { display: grid; grid-template-columns: 200px 1fr; gap: 24px; padding: 28px 0; border-bottom: 1px solid var(--rule); }
  .group-head { position: sticky; top: 16px; align-self: start; }
  .group-head h2 { margin: 0; font-size: 19px; font-weight: 800; line-height: 1.25; }
  .swatch { display: block; width: 28px; height: 6px; border-radius: 2px; margin-bottom: 10px; background: var(--c); }

  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .tile {
    display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center;
    padding: 14px;
    background: var(--plate); color: inherit; text-decoration: none;
    border: 1.5px solid var(--rule); border-radius: 8px;
  }
  .tile:hover { border-color: var(--ink); }
  .tile:focus-visible, .edit:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }
  .key {
    width: 56px; height: 56px; border-radius: 6px;
    display: grid; place-items: center;
    background: var(--c); color: #fff;
    font-size: 26px; font-weight: 800; line-height: 1;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.22);
    transition: transform .08s, box-shadow .08s;
  }
  /* Nút bấm vật lý: bấm thì lún xuống, gờ dưới mỏng lại */
  .tile:active .key { transform: translateY(3px); box-shadow: inset 0 -1px 0 rgba(0,0,0,.22); }
  /* Tên tối đa 2 dòng, dài hơn thì "…" */
  .name { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 600; font-size: 16px; line-height: 1.3; overflow-wrap: break-word; }
  .desc { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--muted); font-size: 13.5px; margin-top: 2px; }

  /* Skeleton khi đang tải: dựng lại đúng khung group/tile để lúc data về không bị nhảy layout */
  .sk { background: var(--rule); box-shadow: none; border-radius: 4px; animation: pulse 1s ease-in-out infinite alternate; }
  .sk-line { display: block; height: 14px; margin: 5px 0; }
  .sk-title { width: 130px; height: 20px; margin: 0; }
  @keyframes pulse { from { opacity: .4; } to { opacity: 1; } }
  .group:not([aria-hidden]) { animation: fadein .3s ease-out both; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } }
  @media (prefers-reduced-motion: reduce) { .sk, .group { animation: none !important; } }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Sắp xếp theo nhóm: nút cạnh tên nhóm, kéo bằng tay nắm để chạm chỗ khác vẫn cuộn được */
  .gactions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .gbtn { font-family: inherit; font-size: 13px; font-weight: 600; color: var(--muted); background: none; border: 1px solid var(--rule); border-radius: 6px; padding: 7px 12px; cursor: pointer; white-space: nowrap; }
  .gbtn:hover { color: var(--ink); border-color: var(--ink); }
  .gbtn:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }
  .gbtn.reset { display: none; border-color: transparent; text-decoration: underline; }
  .sorting .gbtn.reset { display: inline-block; }
  .sorting .gbtn[data-act="sort"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .grip { display: none; width: 40px; height: 44px; margin: -6px -8px -6px 0; place-items: center; color: var(--muted); cursor: grab; touch-action: none; }
  .sorting .grip { display: grid; }
  .sorting .tile { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .sorting .tile:hover { border-color: var(--rule); }
  .tile.sortable-chosen { border-color: var(--ink); }
  .sortable-ghost { opacity: .35; }

  .state { padding: 64px 0; max-width: 52ch; }
  .state h2 { margin: 0 0 6px; font-size: 22px; font-weight: 800; }
  .state p { margin: 0 0 18px; color: var(--muted); }

  @media (max-width: 720px) {
    header { display: none; }
    main { padding-top: 0; }
    .group { grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 20px 0; }
    .group-head { position: static; display: flex; align-items: center; gap: 10px; }
    .group-head h2 { flex: 1; min-width: 0; }
    .gactions { margin: 0; flex-wrap: nowrap; flex-shrink: 0; gap: 2px; }
    .gbtn { padding: 7px 10px; }
    .swatch { display: inline-block; margin: 0; }
    .tiles { grid-template-columns: 1fr; gap: 8px; }
    .tile { padding: 10px; grid-template-columns: 44px 1fr auto; gap: 12px; }
    .key { width: 44px; height: 44px; font-size: 21px; }
    .desc, .sk-sub { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>QL App</h1>
      <p class="lead">Bấm vào ô để mở app.</p>
    </div>
    <a class="edit" id="edit" target="_blank" rel="noopener">Sửa danh sách</a>
  </header>
  <main id="list" aria-live="polite"><p class="sr-only">Đang tải danh sách…</p></main>
  <script>
    // Vẽ skeleton ngay, trước khi script chính fetch sheet
    (() => {
      const tile = w => `<div class="tile"><span class="key sk"></span><span><span class="sk sk-line" style="width:${w}%"></span><span class="sk sk-line sk-sub" style="width:90%"></span></span></div>`;
      const group = ws => `<section class="group" aria-hidden="true"><div class="group-head"><span class="swatch sk"></span><span class="sk sk-line sk-title"></span></div><div class="tiles">${ws.map(tile).join("")}</div></section>`;
      document.getElementById("list").insertAdjacentHTML("beforeend", group([55, 40, 70, 60, 50, 65]) + group([65, 45, 60]));
    })();
  </script>
</div>

<script>
// Sheet portal của công ty, đọc 2 tab qua link export CSV.
// Sheet chỉ cần share "Bất kỳ ai có đường liên kết đều xem được", không cần xuất bản, không bị cache.
//   Danh_Muc_App: phân hệ, tên, mô tả, URL, hiển thị với nhà máy → app nào hiện + nhóm, tên, mô tả
//   Phan_He:      danh sách phân hệ + thứ tự                     → thứ tự nhóm
const SHEET_ID = "14-VWA4pON9HsD5Tj2H-r4ZxMY1I17hFAw_jjx--u_28";
const TABS = { apps: "1747864834", groups: "758659214" };
const csvUrl = gid => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${gid}`;
const SHEET_EDIT_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit#gid=${TABS.apps}`;
// Màu theo thứ tự nhóm. Không dùng navy đậm vì chìm vào nền ở dark mode
const GROUP_COLORS = ["#2F5D8A", "#1F6F6B", "#9B3D2E", "#5C6B2E", "#5B3A6B", "#7A5A12"];

// Parse CSV chuẩn RFC 4180: hỗ trợ dấu phẩy, xuống dòng, "" trong ô có ngoặc kép
function parseCSV(text) {
  const rows = []; let row = [], cell = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') inQ = false;
      else cell += c;
    } else if (c === '"') inQ = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/gi, "d").toLowerCase().trim();

const byName = (a, b) => a.name.localeCompare(b.name, "vi", { sensitivity: "base", numeric: true });

// Đọc 1 tab thành mảng object, key là tiêu đề cột đã bỏ dấu ("Hiển thị với nhà máy " → "hien thi voi nha may")
async function loadTab(gid) {
  const r = await fetch(csvUrl(gid), { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const [head = [], ...rows] = parseCSV(await r.text());
  const keys = head.map(norm);
  return rows.map(row => Object.fromEntries(keys.map((k, i) => [k, (row[i] ?? "").trim()])));
}

// App trong danh mục có "Hiển thị với nhà máy" = TRUE, kèm thứ tự nhóm lấy từ tab Phan_He
function buildApps(catalog, groups) {
  const order = new Map(groups.map(g => [g["ma phan he"], Number(g["thu tu"]) || 999]));
  return catalog
    // ai sửa sheet cũng nhét link được, nên chỉ nhận http(s) để chặn javascript: link
    .filter(a => norm(a["hien thi voi nha may"]) === "true" && a["ten ung dung"] && /^https?:\/\//i.test(a["link ung dung (url)"]))
    .map(a => ({
      name: a["ten ung dung"],
      desc: a["mo ta ngan"] || "",
      group: a["ten phan he"] || "Khác",
      order: order.get(a["ma phan he"]) ?? 999,
      url: a["link ung dung (url)"],
    }));
}

{ // self-check lọc danh mục
  const t = buildApps(
    [{ "ma phan he": "sx", "ten phan he": "Sản xuất", "ten ung dung": "X", "link ung dung (url)": "https://x", "hien thi voi nha may": "TRUE" },
     { "ma phan he": "sx", "ten phan he": "Sản xuất", "ten ung dung": "Y", "link ung dung (url)": "https://y", "hien thi voi nha may": "" },
     { "ma phan he": "sx", "ten phan he": "Sản xuất", "ten ung dung": "Z", "link ung dung (url)": "javascript:alert(1)", "hien thi voi nha may": "TRUE" },
     { "ma phan he": "sx", "ten phan he": "Sản xuất", "ten ung dung": "W", "link ung dung (url)": "#", "hien thi voi nha may": "TRUE" }],
    [{ "ma phan he": "sx", "thu tu": "1" }]);
  console.assert(t.length === 1 && t[0].name === "X" && t[0].group === "Sản xuất" && t[0].order === 1, "buildApps broken");
}
// Chữ trên phím: ký tự đầu của tên
const GRIP = `<span class="grip" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><circle cx="5" cy="3" r="1.5"/><circle cx="11" cy="3" r="1.5"/><circle cx="5" cy="8" r="1.5"/><circle cx="11" cy="8" r="1.5"/><circle cx="5" cy="13" r="1.5"/><circle cx="11" cy="13" r="1.5"/></svg></span>`;
const monogram = name => [...name.trim()][0].toUpperCase();

console.assert(monogram("MMTB") === "M" && monogram("đơn nghỉ") === "Đ", "monogram broken");
console.assert(JSON.stringify(parseCSV('a,"b,""c"""\r\nd,e')) === '[["a","b,\\"c\\""],["d","e"]]', "parseCSV broken");

const list = document.getElementById("list");
document.getElementById("edit").href = SHEET_EDIT_URL;

// Thứ tự user tự sắp, lưu theo trình duyệt: { "Tên phân hệ": [url, url, ...] }
const ORDER_KEY = "ql-app-order";
const loadOrder = () => { try { return JSON.parse(localStorage.getItem(ORDER_KEY)) || {}; } catch { return {}; } };
const saveOrder = o => { try { localStorage.setItem(ORDER_KEY, JSON.stringify(o)); } catch {} };
// App đã sắp theo thứ tự đã lưu; app mới (chưa có trong thứ tự) xếp cuối, theo tên
const sortRows = (rows, saved = []) => {
  const at = a => { const i = saved.indexOf(a.url); return i < 0 ? 1e9 : i; };
  return [...rows].sort((a, b) => at(a) - at(b) || byName(a, b));
};
console.assert(sortRows([{ name: "A", url: "a" }, { name: "B", url: "b" }, { name: "C", url: "c" }], ["c", "x", "a"]).map(r => r.url).join() === "c,a,b", "sortRows broken");

let lastApps = [];
function render(apps) {
  lastApps = apps;
  if (!apps.length) {
    list.innerHTML = `<div class="state"><h2>Chưa có app nào được bật</h2><p>Tick cột "Hiển thị với nhà máy" ở tab Danh_Muc_App, tải lại trang là app hiện ở đây.</p><a class="edit" href="${esc(SHEET_EDIT_URL)}" target="_blank" rel="noopener">Mở danh mục app</a></div>`;
    return;
  }
  const groups = new Map();
  for (const a of apps) {
    if (!groups.has(a.group)) groups.set(a.group, { order: a.order, rows: [] });
    groups.get(a.group).rows.push(a);
  }
  const order = loadOrder();
  list.innerHTML = [...groups]
    .sort(([ga, a], [gb, b]) => a.order - b.order || ga.localeCompare(gb, "vi"))
    .map(([g, { rows }], gi) => `<section class="group" style="--c:${GROUP_COLORS[gi % GROUP_COLORS.length]}" aria-label="${esc(g)}">
      <div class="group-head"><span class="swatch"></span><h2>${esc(g)}</h2>${rows.length > 1 ? `<span class="gactions"><button type="button" class="gbtn" data-act="sort" aria-pressed="false" title="Kéo tay nắm hoặc dùng phím mũi tên để đổi chỗ">Sắp xếp</button><button type="button" class="gbtn reset" data-act="reset">Mặc định</button></span>` : ""}</div>
      <div class="tiles" data-group="${esc(g)}">${sortRows(rows, order[g]).map(a => `<a class="tile" href="${esc(a.url)}" data-url="${esc(a.url)}" target="_blank" rel="noopener">
          <span class="key" aria-hidden="true">${esc(monogram(a.name))}</span>
          <span><span class="name">${esc(a.name)}</span>${a.desc ? `<span class="desc">${esc(a.desc)}</span>` : ""}</span>${GRIP}
        </a>`).join("")}</div>
    </section>`).join("");
}

// ---- Sắp xếp trong nhóm: nút "Sắp xếp" ở đầu nhóm → kéo tay nắm (SortableJS, chỉ tải khi cần) ----
let sortableLib;
const loadSortable = () => sortableLib ??= new Promise((ok, fail) => {
  const s = document.createElement("script");
  s.src = "https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js";
  s.integrity = "sha384-eeLEhtwdMwD3X9y+8P3Cn7Idl/M+w8H4uZqkgD/2eJVkWIN1yKzEj6XegJ9dL3q0";
  s.crossOrigin = "anonymous";
  s.onload = () => ok(window.Sortable);
  s.onerror = () => { sortableLib = null; fail(new Error("Không tải được thư viện kéo thả")); };
  document.head.append(s);
});

function persistOrder(tiles) {
  const o = loadOrder();
  o[tiles.dataset.group] = [...tiles.children].map(c => c.dataset.url);
  saveOrder(o);
}

function setSorting(sec, on) {
  const tiles = sec.querySelector(".tiles"), btn = sec.querySelector('[data-act="sort"]');
  sec.classList.toggle("sorting", on);
  btn.textContent = on ? "Xong" : "Sắp xếp";
  btn.setAttribute("aria-pressed", on);
  sec._sortable?.destroy(); sec._sortable = null;
  if (!on) return;
  loadSortable().then(Sortable => {
    if (!sec.classList.contains("sorting") || sec._sortable) return;
    sec._sortable = Sortable.create(tiles, { animation: 150, handle: ".grip", draggable: ".tile", forceFallback: true, fallbackOnBody: true, onEnd: () => persistOrder(tiles) });
  }).catch(err => alert(err.message + ". Vẫn đổi chỗ được bằng phím mũi tên."));
}

// Về thứ tự mặc định (theo tên) ngay tại chỗ, vẫn ở chế độ sắp xếp
function resetGroup(sec) {
  const tiles = sec.querySelector(".tiles"), g = tiles.dataset.group;
  const byUrl = new Map([...tiles.children].map(c => [c.dataset.url, c]));
  sortRows(lastApps.filter(a => a.group === g)).forEach(a => byUrl.has(a.url) && tiles.append(byUrl.get(a.url)));
  const o = loadOrder(); delete o[g]; saveOrder(o);
}

list.addEventListener("click", e => {
  const btn = e.target.closest(".gbtn");
  if (btn) {
    const sec = btn.closest(".group");
    btn.dataset.act === "sort" ? setSorting(sec, !sec.classList.contains("sorting")) : resetGroup(sec);
    return;
  }
  // Đang sắp xếp thì bấm ô không mở app
  if (e.target.closest(".sorting .tile")) e.preventDefault();
});
// Bàn phím: mũi tên lên/trái lùi 1 ô, xuống/phải tiến 1 ô
list.addEventListener("keydown", e => {
  const tile = e.target.closest(".sorting .tile");
  if (!tile) return;
  const back = e.key === "ArrowUp" || e.key === "ArrowLeft", fwd = e.key === "ArrowDown" || e.key === "ArrowRight";
  if (!back && !fwd) return;
  e.preventDefault();
  const sib = back ? tile.previousElementSibling : tile.nextElementSibling;
  if (!sib) return;
  back ? sib.before(tile) : sib.after(tile);
  tile.focus();
  persistOrder(tile.parentElement);
});

Promise.all([loadTab(TABS.apps), loadTab(TABS.groups)])
  .then(([catalog, groups]) => {
    if (!catalog.length || !("hien thi voi nha may" in catalog[0])) throw new Error("tab Danh_Muc_App thiếu cột Hiển thị với nhà máy");
    render(buildApps(catalog, groups));
  })
  .catch(err => {
    list.innerHTML = `<div class="state"><h2>Không tải được danh sách app</h2><p>Kiểm tra mạng rồi tải lại trang. Nếu vẫn lỗi, kiểm tra sheet còn share "Bất kỳ ai có đường liên kết" và tab Danh_Muc_App còn đủ cột (${esc(err.message)}).</p><a class="edit" href="${esc(SHEET_EDIT_URL)}" target="_blank" rel="noopener">Mở danh mục app</a></div>`;
  });
</script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
</body>
</html>
